<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer glowing surface -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#softShadow)"/>

  <!-- Medical Cross Container -->
  <g transform="translate(136, 136)">
    <!-- Vertical bar -->
    <rect x="88" y="0" width="64" height="240" rx="24" fill="url(#crossGrad)"/>
    <!-- Horizontal bar -->
    <rect x="0" y="88" width="240" height="64" rx="24" fill="url(#crossGrad)"/>
    <!-- Center pulse node -->
    <circle cx="120" cy="120" r="28" fill="#ffffff"/>
    <circle cx="120" cy="120" r="16" fill="#2563eb"/>
  </g>
</svg>
